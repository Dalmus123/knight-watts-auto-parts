<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | Knight Watts Auto Parts</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .confirmation-container {
            max-width: 800px;
            margin: 120px auto 60px;
            padding: 0 20px;
            text-align: center;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #00A86B, #008855);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .confirmation-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            margin-top: 40px;
            text-align: left;
        }

        .order-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .order-detail-row:last-child {
            border-bottom: none;
        }

        .order-detail-label {
            color: rgba(255, 255, 255, 0.6);
        }

        .order-detail-value {
            color: #fff;
            font-weight: 600;
        }

        .next-steps {
            background: rgba(0, 168, 107, 0.1);
            border: 1px solid rgba(0, 168, 107, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin-top: 30px;
            text-align: left;
        }

        .next-steps h3 {
            color: #00A86B;
            margin-bottom: 16px;
        }

        .next-steps ol {
            color: rgba(255, 255, 255, 0.9);
            margin-left: 20px;
        }

        .next-steps li {
            margin-bottom: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: 40px;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <path d="M20 5L35 15V25L20 35L5 25V15L20 5Z" stroke="#00A86B" stroke-width="2" fill="none"/>
                        <circle cx="20" cy="20" r="6" fill="#00A86B"/>
                        <path d="M15 20L18 23L25 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>KNIGHT <span class="ke">WATTS</span></span>
                </div>
            </div>
        </div>
    </header>

    <div class="confirmation-container">
        <div class="success-icon">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h1 style="color: #fff; font-size: 2.5rem; margin-bottom: 16px;">Order Confirmed!</h1>
        <p style="color: rgba(255, 255, 255, 0.7); font-size: 1.2rem;">
            Thank you for your order. We'll process it right away!
        </p>

        <div class="confirmation-card">
            <h2 style="color: #00A86B; margin-bottom: 24px;">Order Details</h2>
            <div id="orderDetails">
                <!-- Order details will be inserted here -->
            </div>
        </div>

        <div class="next-steps">
            <h3>📋 What Happens Next?</h3>
            <ol id="nextStepsList">
                <!-- Steps will be inserted based on payment method -->
            </ol>
        </div>

        <div class="action-buttons">
            <a href="index.html" class="btn btn-primary" style="text-decoration: none;">
                Continue Shopping
            </a>
            <a href="tel:+254714243345" class="btn btn-secondary" style="text-decoration: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
                Call Us
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');

            if (!orderId) {
                window.location.href = 'index.html';
                return;
            }

            // Get order from localStorage
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            const order = orders.find(o => o.orderId === orderId);

            if (!order) {
                window.location.href = 'index.html';
                return;
            }

            displayOrderDetails(order);
        });

        function displayOrderDetails(order) {
            const detailsContainer = document.getElementById('orderDetails');
            const deliveryText = order.delivery.location.includes('delivery') ? 'Home Delivery' : 'Store Pickup';
            const locationName = order.delivery.location.includes('embu') ? 'Embu' : 'Garissa';

            detailsContainer.innerHTML = `
                <div class="order-detail-row">
                    <span class="order-detail-label">Order ID</span>
                    <span class="order-detail-value">${order.orderId}</span>
                </div>
                <div class="order-detail-row">
                    <span class="order-detail-label">Date</span>
                    <span class="order-detail-value">${new Date(order.timestamp).toLocaleDateString('en-KE', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })}</span>
                </div>
                <div class="order-detail-row">
                    <span class="order-detail-label">Customer</span>
                    <span class="order-detail-value">${order.customer.name}</span>
                </div>
                <div class="order-detail-row">
                    <span class="order-detail-label">Phone</span>
                    <span class="order-detail-value">${order.customer.phone}</span>
                </div>
                <div class="order-detail-row">
                    <span class="order-detail-label">Delivery Method</span>
                    <span class="order-detail-value">${deliveryText} - ${locationName}</span>
                </div>
                <div class="order-detail-row">
                    <span class="order-detail-label">Payment Method</span>
                    <span class="order-detail-value">${getPaymentMethodName(order.payment.method)}</span>
                </div>
                <div class="order-detail-row">
                    <span class="order-detail-label">Items</span>
                    <span class="order-detail-value">${order.items.length} item(s)</span>
                </div>
                <div class="order-detail-row" style="font-size: 1.3rem;">
                    <span class="order-detail-label">Total Amount</span>
                    <span class="order-detail-value" style="color: #00A86B;">KSh ${order.payment.amount.toLocaleString()}</span>
                </div>
            `;

            // Display next steps based on payment method
            displayNextSteps(order);
        }

        function getPaymentMethodName(method) {
            const names = {
                'mpesa': 'M-Pesa',
                'cash': 'Cash Payment',
                'bank': 'Bank Transfer'
            };
            return names[method] || method;
        }

        function displayNextSteps(order) {
            const stepsList = document.getElementById('nextStepsList');
            let steps = [];

            if (order.payment.method === 'mpesa') {
                steps = [
                    'You will receive an M-Pesa confirmation SMS',
                    'We will call you at ' + order.customer.phone + ' to confirm your order',
                    'Your parts will be ready for ' + (order.delivery.location.includes('delivery') ? 'delivery' : 'pickup') + ' within 1-2 hours',
                    order.delivery.location.includes('delivery') ? 
                        'Our rider will deliver to: ' + order.delivery.address :
                        'Visit our ' + (order.delivery.location.includes('embu') ? 'Embu' : 'Garissa') + ' branch to collect',
                    'For questions, call +254 714 243 345'
                ];
            } else if (order.payment.method === 'cash') {
                steps = [
                    'We will call you at ' + order.customer.phone + ' to confirm your order',
                    'Please have the exact amount ready: KSh ' + order.payment.amount.toLocaleString(),
                    'Your parts will be prepared within 1-2 hours',
                    order.delivery.location.includes('delivery') ? 
                        'Our rider will deliver and collect payment' :
                        'Come to our store to collect and pay',
                    'For questions, call +254 714 243 345'
                ];
            } else if (order.payment.method === 'bank') {
                steps = [
                    'Transfer KSh ' + order.payment.amount.toLocaleString() + ' to: Equity Bank, Account 0123456789',
                    'Use reference: ' + order.orderId,
                    'Send payment confirmation to WhatsApp: +254 714 243 345',
                    'We will process your order once payment is confirmed',
                    'Parts will be ready within 2-4 hours after confirmation'
                ];
            }

            stepsList.innerHTML = steps.map(step => `<li>${step}</li>`).join('');
        }
    </script>
</body>
</html>
